  <text class="nodeText" style="font:400 16px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#475569;" x="900" y="668" text-anchor="middle">一次取得臉部關鍵點、表情係數與頭部姿態</text>

  <rect class="process" style="fill:#ffffff; stroke:#64748b; stroke-width:2.5;" x="140" y="455" width="360" height="90" rx="8" filter="url(#shadow)"/>
  <text class="nodeTitle" style="font:700 21px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#111827;" x="320" y="490" text-anchor="middle">無臉或可信度不足</text>
  <text class="nodeText" style="font:400 16px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#475569;" x="320" y="518" text-anchor="middle">標記狀態，等待下一個可分析影格</text>

