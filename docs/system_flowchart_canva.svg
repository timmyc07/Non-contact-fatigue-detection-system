  <rect class="bg" style="fill:#f8fafc;" x="0" y="0" width="1800" height="1280"/>

  <text class="title" style="font:700 42px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#111827;" x="900" y="58" text-anchor="middle">結合影像辨識與生理感測之疲勞偵測系統流程圖</text>
  <text class="subtitle" style="font:400 22px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#475569;" x="900" y="95" text-anchor="middle">依流程圖規範重新整理：單一起點、明確判斷、左右分支、匯合評分與下一影格循環</text>

  <ellipse class="start" style="fill:#e0f2fe; stroke:#0284c7; stroke-width:2.5;" cx="900" cy="145" rx="150" ry="36" filter="url(#shadow)"/>
  <text class="nodeTitle" style="font:700 21px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#111827;" x="900" y="153" text-anchor="middle">開始監測</text>

  <path class="data" style="fill:#eef4ff; stroke:#2563eb; stroke-width:2.5;" d="M690 205 L1070 205 L1035 285 L655 285 Z" filter="url(#shadow)"/>
  <text class="nodeTitle" style="font:700 21px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#111827;" x="862" y="238" text-anchor="middle">一般攝影機輸入</text>
  <text class="nodeText" style="font:400 16px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#475569;" x="862" y="263" text-anchor="middle">相機、解析度、FPS、鏡像校正</text>

  <rect class="process" style="fill:#ffffff; stroke:#64748b; stroke-width:2.5;" x="690" y="320" width="380" height="78" rx="8" filter="url(#shadow)"/>
