  <text class="nodeText" style="font:400 16px Noto Sans TC, Microsoft JhengHei, Arial, sans-serif; fill:#475569;" x="880" y="375" text-anchor="middle">只保留最新畫面，降低即時分析延遲</text>

  <polygon class="decision" style="fill:#fff7ed; stroke:#f59e0b; stroke-width:2.8;" points="900,430 1045,500 900,570 755,500" filter="url(#shadow)"/>
