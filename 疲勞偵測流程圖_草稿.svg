<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f4b6b" />
    </marker>
    <style>
      .box { fill:#fff; stroke:#1f4b6b; stroke-width:2.5; rx:8; }
      .title { font: 700 24px 'Noto Sans TC', Arial; fill:#1f4b6b; }
      .label { font: 16px 'Noto Sans TC', Arial; fill:#0b2a3a; font-weight:600; }
      .sub { font: 14px 'Noto Sans TC', Arial; fill:#264653; }
      .note { font: 13px 'Noto Sans TC', Arial; fill:#6b7b85; }
    </style>
  </defs>

  <text x="700" y="44" text-anchor="middle" class="title">疲勞偵測流程圖（草稿）</text>

  <!-- Row 1: Input -->
  <rect class="box" x="80" y="100" width="280" height="100" />
  <text x="220" y="140" text-anchor="middle" class="label">相機 / 擷取</text>
  <text x="220" y="165" text-anchor="middle" class="sub">FFmpeg 或 V4L2 / DirectShow</text>

  <rect class="box" x="420" y="100" width="280" height="100" />
  <text x="560" y="140" text-anchor="middle" class="label">前處理</text>
  <text x="560" y="165" text-anchor="middle" class="sub">ROI 擷取、影像去噪、色彩校正</text>

  <!-- Row 2: Detection -->
  <rect class="box" x="760" y="100" width="280" height="100" />
  <text x="900" y="140" text-anchor="middle" class="label">臉部偵測 / Landmark</text>
  <text x="900" y="165" text-anchor="middle" class="sub">MediaPipe 等模型</text>

  <!-- arrows row1->row2 -->
  <line x1="360" y1="150" x2="420" y2="150" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="700" y1="150" x2="760" y2="150" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Row 3: rPPG -->
  <rect class="box" x="420" y="260" width="520" height="120" />
  <text x="680" y="295" text-anchor="middle" class="label">rPPG 訊號擷取與處理</text>
  <text x="680" y="320" text-anchor="middle" class="sub">像素時間序列擷取 → 去趨勢 → 濾波 (bandpass)</text>

  <!-- arrows detection -> rPPG -->
  <line x1="900" y1="200" x2="900" y2="260" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="560" y1="200" x2="680" y2="260" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Row 4: Feature extraction -->
  <rect class="box" x="120" y="440" width="380" height="120" />
  <text x="310" y="475" text-anchor="middle" class="label">特徵擷取</text>
  <text x="310" y="500" text-anchor="middle" class="sub">心率(HR)、HRV、呼吸率、PPG 特徵</text>

  <!-- Row 4 right: Model / Scoring -->
  <rect class="box" x="600" y="440" width="520" height="120" />
  <text x="860" y="475" text-anchor="middle" class="label">疲勞評分 / 判定</text>
  <text x="860" y="500" text-anchor="middle" class="sub">規則或 ML 模型 → 得分、等級、警示</text>

  <!-- arrows rPPG -> features & scorer -->
  <path d="M 680 380 Q 500 420 380 460" stroke="#1f4b6b" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <line x1="680" y1="380" x2="760" y2="440" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Decision box -->
  <rect class="box" x="300" y="620" width="440" height="100" />
  <text x="520" y="655" text-anchor="middle" class="label">閾值 / 決策</text>
  <text x="520" y="680" text-anchor="middle" class="sub">是否需要警示或進一步處理？</text>

  <!-- arrows features/scorer -> decision -->
  <line x1="380" y1="560" x2="380" y2="620" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="860" y1="560" x2="740" y2="620" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Outputs: Alert, Store, Dashboard -->
  <rect class="box" x="80" y="760" width="240" height="100" />
  <text x="200" y="800" text-anchor="middle" class="label">警示 / Alert</text>
  <text x="200" y="825" text-anchor="middle" class="sub">聲音、視覺、通知</text>

  <rect class="box" x="420" y="760" width="280" height="100" />
  <text x="560" y="800" text-anchor="middle" class="label">資料儲存</text>
  <text x="560" y="825" text-anchor="middle" class="sub">rPPG、事件、log、影片</text>

  <rect class="box" x="820" y="760" width="460" height="100" />
  <text x="1050" y="800" text-anchor="middle" class="label">Web Dashboard / Recorder</text>
  <text x="1050" y="825" text-anchor="middle" class="sub">即時顯示、歷史查詢、影片回放</text>

  <!-- arrows decision -> outputs -->
  <line x1="520" y1="720" x2="200" y2="760" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="520" y1="720" x2="560" y2="760" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="520" y1="720" x2="940" y2="760" stroke="#1f4b6b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Notes -->
  <text x="70" y="960" class="note">說明：此流程為草稿，依順序為「擷取 → 前處理 → 偵測 → rPPG 訊號處理 → 特徵擷取 → 評分 → 決策 → 輸出」。可視需求加入同步處理、異步儲存或外部模型服務。</text>

</svg>